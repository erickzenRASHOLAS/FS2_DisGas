server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: cualquier ruta (/login, /ordenes...) devuelve index.html y la resuelve React.
    # Sin esto, al recargar (F5) en /inventario nginx respondería 404.
    location / {
        try_files $uri /index.html;
    }

    # Los archivos con hash (assets/*) se pueden guardar en caché por mucho tiempo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
